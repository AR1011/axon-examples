[package]
name = "cron-singleton"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Example: a cluster-wide cron, one scheduler under a Paxos lease, fires fenced by its epoch in a run log"

[dependencies]
axon.workspace = true
axon-cluster.workspace = true
axon-net.workspace = true
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[dev-dependencies]
axon-testkit.workspace = true

[lints]
workspace = true
