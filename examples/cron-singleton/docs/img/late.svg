<svg xmlns="http://www.w3.org/2000/svg" width="880" height="264" viewBox="0 0 880 264" role="img"><title>How late the latest fire is after its tick</title><rect x="0.5" y="0.5" width="879" height="263" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">How late the latest fire is after its tick</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Six runs of fault.sh. After a failover the missed ticks catch up; a paused run log holds every fire back.</text><line x1="181.4" y1="74" x2="181.4" y2="234" stroke="#8c959f"/><text x="181.4" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="295.1" y1="74" x2="295.1" y2="234" stroke="#eaeef2"/><text x="295.1" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">2.5</text><line x1="408.8" y1="74" x2="408.8" y2="234" stroke="#eaeef2"/><text x="408.8" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">5</text><line x1="522.5" y1="74" x2="522.5" y2="234" stroke="#eaeef2"/><text x="522.5" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">7.5</text><line x1="636.3" y1="74" x2="636.3" y2="234" stroke="#eaeef2"/><text x="636.3" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">10</text><line x1="750" y1="74" x2="750" y2="234" stroke="#eaeef2"/><text x="750" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">12.5</text><text x="766.9" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">s</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">steady state</text><rect x="181.4" y="86" width="1.5" height="16" rx="2" fill="#3a6fd8"/><text x="187.4" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1 ms</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">a planned handover</text><rect x="181.4" y="126" width="1.5" height="16" rx="2" fill="#3a6fd8"/><text x="187.4" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1 ms</text><line x1="24" y1="154" x2="856" y2="154" stroke="#eaeef2"/><text x="24" y="178.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">after a failover</text><rect x="181.4" y="166" width="154.7" height="16" rx="2" fill="#3a6fd8"/><rect x="336" y="166" width="95.5" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="437.6" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">3.4 to 5.5 s</text><line x1="24" y1="194" x2="856" y2="194" stroke="#eaeef2"/><text x="24" y="218.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the run log paused 10 s</text><rect x="181.4" y="206" width="468.5" height="16" rx="2" fill="#3a6fd8"/><rect x="649.9" y="206" width="40.9" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="696.9" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">10.3 to 11.2 s</text></svg>
