<svg xmlns="http://www.w3.org/2000/svg" width="880" height="426" viewBox="0 0 880 426" role="img"><title>The processes of fault.sh</title><rect x="0.5" y="0.5" width="879" height="425" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The processes of fault.sh</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Four processes on loopback. One scheduler runs at a time, on the node that holds the lease.</text><rect x="156.9" y="72" width="566.2" height="126" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="168.9" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Scheduler nodes: cron-singleton sched</text><path d="M555.5 189 L454.6 259" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M268.9 201 L294.3 259" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M457.6 323 L617 323" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="168.9" y="96" width="172.7" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="255.3" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">s1</text><text x="255.3" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">sched</text><rect x="180.9" y="142.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="192.9" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">keeper: watch_key</text><rect x="180.9" y="158.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="192.9" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">kind cron registered</text><rect x="353.6" y="96" width="172.7" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="440" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">s2</text><text x="440" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">sched, lease acceptor</text><rect x="365.6" y="142.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="377.6" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">keeper: watch_key</text><rect x="365.6" y="158.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="377.6" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">kind cron registered</text><rect x="538.4" y="96" width="172.7" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="624.7" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">s3</text><text x="624.7" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">sched, lease acceptor</text><rect x="550.4" y="142.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="562.4" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">keeper: watch_key</text><rect x="550.4" y="158.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="562.4" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Scheduler cron/singleton</text><rect x="270" y="262" width="184.6" height="122" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="362.3" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">runlog</text><text x="362.3" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">cron-singleton runlog</text><rect x="282" y="308.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="294" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">RunLogActor, named runlog</text><rect x="282" y="324.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="294" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">epoch, last tick per job</text><rect x="282" y="340.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="294" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">seed server</text><rect x="282" y="356.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="294" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">lease acceptor</text><rect x="620" y="270" width="137.3" height="106" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="688.7" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">audit</text><text x="688.7" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">cron-singleton audit</text><rect x="632" y="316.5" width="6" height="6" rx="1" fill="#aab3bd"/><text x="644" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">reads runlog.out</text><rect x="632" y="332.5" width="6" height="6" rx="1" fill="#aab3bd"/><text x="644" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">each tick once</text><rect x="632" y="348.5" width="6" height="6" rx="1" fill="#aab3bd"/><text x="644" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">epochs only go up</text><rect x="463.3" y="199.5" width="203.6" height="49" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="565" y="213.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Claim(epoch): last tick per job</text><text x="565" y="228.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Fire(epoch, ticks): Fired, Duplicate,</text><text x="565" y="243.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Fenced or Gap</text><rect x="193.8" y="213" width="95.5" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="241.6" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">seed discovery,</text><text x="241.6" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">lease rounds</text><rect x="480.1" y="306" width="114.3" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="537.3" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">stdout:</text><text x="537.3" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">CLAIM, FIRE lines</text><text x="24" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">s3 holds the lease first here. Without ACCEPTORS set, runlog, s1 and s2 are the acceptors. The run log keeps its state in memory.</text></svg>
