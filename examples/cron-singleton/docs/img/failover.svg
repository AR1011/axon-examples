<svg xmlns="http://www.w3.org/2000/svg" width="880" height="184" viewBox="0 0 880 184" role="img"><title>From the fault to a new owner's first fire</title><rect x="0.5" y="0.5" width="879" height="183" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">From the fault to a new owner's first fire</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Six runs of fault.sh. The lease is 6 s. The lighter part of a bar is the range over the runs.</text><line x1="162.5" y1="74" x2="162.5" y2="154" stroke="#8c959f"/><text x="162.5" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="358.3" y1="74" x2="358.3" y2="154" stroke="#eaeef2"/><text x="358.3" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">2</text><line x1="554.2" y1="74" x2="554.2" y2="154" stroke="#eaeef2"/><text x="554.2" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">4</text><line x1="750" y1="74" x2="750" y2="154" stroke="#eaeef2"/><text x="750" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">6</text><text x="758.4" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">s</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">SIGSTOP the holder</text><rect x="162.5" y="86" width="547.4" height="16" rx="2" fill="#3a6fd8"/><rect x="709.9" y="86" width="2" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="717.8" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">5.59 to 5.61 s</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">kill -9 the holder</text><rect x="162.5" y="126" width="419.1" height="16" rx="2" fill="#3a6fd8"/><rect x="581.6" y="126" width="2" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="589.5" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">4.28 to 4.30 s</text></svg>
