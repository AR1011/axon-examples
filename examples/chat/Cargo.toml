[package]
name = "chat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Example: chat rooms as axon streams, sessions on any node, websocket fanout"

[dependencies]
axon.workspace = true
axon-cluster = { workspace = true, features = ["consul"] }
axon-net.workspace = true
axon-obs = { workspace = true, features = ["dashboard"] }
axon-stream = { workspace = true, features = ["cluster"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"

[dev-dependencies]
axon-testkit.workspace = true

[lints]
workspace = true
