<svg xmlns="http://www.w3.org/2000/svg" width="880" height="424" viewBox="0 0 880 424" role="img"><title>Three durable nodes of scripts/run.sh</title><rect x="0.5" y="0.5" width="879" height="423" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Three durable nodes of scripts/run.sh</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Each of the 256 shards runs on one node. Its writes go to the Logs of all three; two must sync them.</text><rect x="173.6" y="242" width="532.7" height="158" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="185.6" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Nodes n1, n2, n3</text><path d="M274.4 154 L282.3 239" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M492.6 125 L514.6 125" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M595.2 181 L593.1 239" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="203" y="99" width="137.3" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="271.6" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">redis-cli</text><text x="271.6" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">or go-ycsb, go-redis</text><rect x="352.3" y="99" width="137.3" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="421" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">browser</text><text x="421" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">the console page</text><rect x="517.6" y="72" width="159.4" height="106" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="597.3" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">kv console</text><text x="597.3" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">a process of its own</text><rect x="529.6" y="118.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="541.6" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">INFO of each node, 1 s</text><rect x="529.6" y="134.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="541.6" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">an hour of samples</text><rect x="529.6" y="150.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="541.6" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">the runs in results/</text><rect x="185.6" y="266" width="161.6" height="122" rx=