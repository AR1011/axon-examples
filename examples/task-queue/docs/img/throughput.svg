<svg xmlns="http://www.w3.org/2000/svg" width="880" height="224" viewBox="0 0 880 224" role="img"><title>Jobs a second in the demo</title><rect x="0.5" y="0.5" width="879" height="223" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Jobs a second in the demo</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Five runs of the demo, 24 slots. The lighter part of a bar is the range over the runs.</text><line x1="236.1" y1="74" x2="236.1" y2="194" stroke="#8c959f"/><text x="236.1" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="364.6" y1="74" x2="364.6" y2="194" stroke="#eaeef2"/><text x="364.6" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">500</text><line x1="493.1" y1="74" x2="493.1" y2="194" stroke="#eaeef2"/><text x="493.1" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">1,000</text><line x1="621.5" y1="74" x2="621.5" y2="194" stroke="#eaeef2"/><text x="621.5" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">1,500</text><line x1="750" y1="74" x2="750" y2="194" stroke="#eaeef2"/><text x="750" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">2,000</text><text x="770.3" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">jobs/s</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the whole demo</text><rect x="236.1" y="86" width="381.3" height="16" rx="2" fill="#3a6fd8"/><rect x="617.4" y="86" width="4.9" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="628.3" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1,484 to 1,503 jobs/s</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">each of the first three workers</text><rect x="236.1" y="126" width="144.4" height="16" rx="2" fill="#3a6fd8"/><rect x="380.5" y="126" width="5.9" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="392.4" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">562 to 585 jobs/s</text><line x1="24" y1="154" x2="856" y2="154" stroke="#eaeef2"/><text x="24" y="178.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the worker added late</text><rect x="236.1" y="166" width="126.7" height="16" rx="2" fill="#3a6fd8"/><rect x="362.8" y="166" width="3.6" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="372.4" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">493 to 507 jobs/s</text></svg>
