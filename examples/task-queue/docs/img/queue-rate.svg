<svg xmlns="http://www.w3.org/2000/svg" width="880" height="184" viewBox="0 0 880 184" role="img"><title>The queue alone: 200,000 jobs that do nothing</title><rect x="0.5" y="0.5" width="879" height="183" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The queue alone: 200,000 jobs that do nothing</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">run.sh 200000 0, four processes on loopback. Lower bounds: status is read every 200 ms.</text><line x1="208.1" y1="74" x2="208.1" y2="154" stroke="#8c959f"/><text x="208.1" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="316.5" y1="74" x2="316.5" y2="154" stroke="#eaeef2"/><text x="316.5" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">50,000</text><line x1="424.9" y1="74" x2="424.9" y2="154" stroke="#eaeef2"/><text x="424.9" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">100,000</text><line x1="533.2" y1="74" x2="533.2" y2="154" stroke="#eaeef2"/><text x="533.2" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">150,000</text><line x1="641.6" y1="74" x2="641.6" y2="154" stroke="#eaeef2"/><text x="641.6" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">200,000</text><line x1="750" y1="74" x2="750" y2="154" stroke="#eaeef2"/><text x="750" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">250,000</text><text x="777.1" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">jobs/s</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">8 runs at once per worker</text><rect x="208.1" y="86" width="333.8" height="16" rx="2" fill="#3a6fd8"/><text x="547.9" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">at least 154,000 jobs/s</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">32 runs at once per worker</text><rect x="208.1" y="126" width="446.5" height="16" rx="2" fill="#3a6fd8"/><text x="660.6" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">at least 206,000 jobs/s</text></svg>
