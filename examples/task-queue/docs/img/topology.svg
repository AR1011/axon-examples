<svg xmlns="http://www.w3.org/2000/svg" width="880" height="526" viewBox="0 0 880 526" role="img"><title>The processes of run.sh</title><rect x="0.5" y="0.5" width="879" height="525" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The processes of run.sh</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">One queue node holds every job in memory. Workers pull jobs from it; clients come and go.</text><rect x="244.4" y="358" width="391.3" height="126" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="256.4" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Workers</text><path d="M440 127 L440 185" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M440 355 L440 297" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="289.1" y="72" width="144.9" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="361.5" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">produce</text><text x="361.5" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">a client</text><rect x="446" y="72" width="144.9" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="518.5" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">status, dead, retry</text><text x="518.5" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">clients</text><rect x="364" y="188" width="152" height="106" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="440" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">queue</text><text x="440" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">role=queue</text><rect x="376" y="234.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="388" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">seed server</text><rect x="376" y="250.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="388" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Broker actor</text><rect x="376" y="266.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="388" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">every job, in memory</text><rect x="256.4" y="382" width="114.4" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="313.6" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">worker-1</text><text x="313.6" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">role=worker</text><rect x="268.4" y="428.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="280.4" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Worker actor</text><rect x="268.4" y="444.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="280.4" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">8 runs at once</text><rect x="382.8" y="382" width="114.4" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="440" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">worker-2</text><text x="440" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">role=worker</text><rect x="394.8" y="428.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="406.8" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Worker actor</text><rect x="394.8" y="444.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="406.8" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">8 runs at once</text><rect x="509.2" y="382" width="114.4" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="566.4" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">worker-3</text><text x="566.4" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">role=worker</text><rect x="521.2" y="428.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="533.2" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Worker actor</text><rect x="521.2" y="444.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="533.2" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">8 runs at once</text><rect x="388.2" y="139" width="103.7" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="440" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Enqueue, Status,</text><text x="440" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Dead, Retry</text><rect x="322.6" y="309" width="234.9" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="440" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Fetch: outcomes and the runs still going;</text><text x="440" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">the answer: the jobs it asked for</text><text x="24" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Every node finds the cluster through the seed server on the queue node. The calls are JSON, to the name task-queue.broker.</text></svg>
