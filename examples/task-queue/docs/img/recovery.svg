<svg xmlns="http://www.w3.org/2000/svg" width="880" height="184" viewBox="0 0 880 184" role="img"><title>After a crash</title><rect x="0.5" y="0.5" width="879" height="183" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">After a crash</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">The time until the jobs run again. The lighter part of a bar is the range over the runs.</text><line x1="319.1" y1="74" x2="319.1" y2="154" stroke="#8c959f"/><text x="319.1" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="405.3" y1="74" x2="405.3" y2="154" stroke="#eaeef2"/><text x="405.3" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0.25</text><line x1="491.5" y1="74" x2="491.5" y2="154" stroke="#eaeef2"/><text x="491.5" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0.5</text><line x1="577.7" y1="74" x2="577.7" y2="154" stroke="#eaeef2"/><text x="577.7" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0.75</text><line x1="663.8" y1="74" x2="663.8" y2="154" stroke="#eaeef2"/><text x="663.8" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">1</text><line x1="750" y1="74" x2="750" y2="154" stroke="#eaeef2"/><text x="750" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">1.25</text><text x="766.9" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">s</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">a worker killed: its jobs handed out again</text><rect x="319.1" y="86" width="348.1" height="16" rx="2" fill="#3a6fd8"/><text x="673.3" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1.01 s, every run</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">the queue node killed: first job on the new one</text><rect x="319.1" y="126" width="117.2" height="16" rx="2" fill="#3a6fd8"/><rect x="436.3" y="126" width="141.3" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="583.7" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">0.34 to 0.75 s</text></svg>
