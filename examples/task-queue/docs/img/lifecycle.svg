<svg xmlns="http://www.w3.org/2000/svg" width="880" height="532" viewBox="0 0 880 532" role="img"><title>The states of a job</title><rect x="0.5" y="0.5" width="879" height="531" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The states of a job</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">The broker moves each job between these states. A worker's poll carries the outcomes of its runs.</text><path d="M388 127 L262.4 197" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M488.4 127 L605.2 197" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M587 226 L273.6 226" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M288.8 255 L381.6 325" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M350.9 325 L244.4 255" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M503.9 325 L609.7 255" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M372.3 383 L257.3 453" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M501.5 383 L601.6 453" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M173.3 453 Q220 354.2 173.8 255" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="382.1" y="72" width="115.8" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="440" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Enqueue</text><text x="440" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">from a producer</text><rect x="150" y="200" width="120.6" height="52" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="210.3" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">pending</text><text x="210.3" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">in line by priority</text><rect x="590" y="200" width="127.2" height="52" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="653.6" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">delayed</text><text x="653.6" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">waits for its time</text><rect x="388.2" y="328" width="103.6" height="52" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="440" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">running</text><text x="440" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">on one worker</text><rect x="150" y="456" width="119.3" height="52" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="209.6" y="479" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">dead</text><text x="209.6" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">no attempts left</text><rect x="590" y="456" width="106" height="52" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="643" y="479" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">done</text><text x="643" y="494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">kept for dedup</text><rect x="297.4" y="152.5" width="55.5" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="325.2" y="166.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">no delay</text><rect x="505.8" y="152.5" width="81.9" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="546.8" y="166.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">delay_ms &gt; 0</text><rect x="415.2" y="216.5" width="30.3" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="430.3" y="230.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">due</text><rect x="335.4" y="276.5" width="43.5" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="357.2" y="290.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Fetch</text><rect x="226" y="297" width="115.4" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="283.7" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">taken back: no poll,</text><text x="283.7" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">or not listed</text><rect x="510.4" y="280.5" width="92.8" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="556.8" y="294.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">failed: backoff</text><rect x="254" y="408.5" width="121.7" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="314.8" y="422.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">failed, last attempt</text><rect x="539.4" y="408.5" width="24.2" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="551.5" y="422.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">ok</text><rect x="151.8" y="337.1" width="89.9" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="196.8" y="351.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Retry:</text><text x="196.8" y="366.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">new attempts</text></svg>
