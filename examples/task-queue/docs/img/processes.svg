<svg xmlns="http://www.w3.org/2000/svg" width="880" height="328" viewBox="0 0 880 328" role="img"><title>a queue node and three workers as processes</title><rect x="0.5" y="0.5" width="879" height="327" rx="6" fill="#22272e" stroke="#d0d7de"/><path d="M0.5 30 H879.5" stroke="#2d333b"/><circle cx="18" cy="15.0" r="5" fill="#2d333b" stroke="#444c56"/><circle cx="34" cy="15.0" r="5" fill="#2d333b" stroke="#444c56"/><circle cx="50" cy="15.0" r="5" fill="#2d333b" stroke="#444c56"/><text x="440" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">a queue node and three workers as processes</text><text x="18" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ task-queue produce 3000</text><text x="18" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">enqueued 3000 in 0.01s, held back 0 times by a full queue</text><text x="18" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ kill -9 &lt;pid of worker-2&gt;</text><text x="18" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ sleep 8; task-queue status | jq -c '.Status.queues | to_entries[] | {queue: .key} + .value'</text><text x="18" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;queue&quot;:&quot;email&quot;,&quot;pending&quot;:0,&quot;delayed&quot;:0,&quot;running&quot;:0,&quot;done&quot;:999,&quot;dead&quot;:1}</text><text x="18" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;queue&quot;:&quot;reports&quot;,&quot;pending&quot;:0,&quot;delayed&quot;:0,&quot;running&quot;:0,&quot;done&quot;:999,&quot;dead&quot;:1}</text><text x="18" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;queue&quot;:&quot;webhooks&quot;,&quot;pending&quot;:0,&quot;delayed&quot;:0,&quot;running&quot;:0,&quot;done&quot;:999,&quot;dead&quot;:1}</text><text x="18" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ task-queue status | jq -c '.Status.workers | to_entries[] | {worker: .key} + .value'</text><text x="18" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;worker&quot;:&quot;worker-1&quot;,&quot;running&quot;:0,&quot;done&quot;:1249,&quot;failed&quot;:115,&quot;lost&quot;:0}</text><text x="18" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;worker&quot;:&quot;worker-2&quot;,&quot;running&quot;:0,&quot;done&quot;:624,&quot;failed&quot;:32,&quot;lost&quot;:8}</text><text x="18" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;worker&quot;:&quot;worker-3&quot;,&quot;running&quot;:0,&quot;done&quot;:1124,&quot;failed&quot;:87,&quot;lost&quot;:0}</text><text x="18" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ task-queue dead | jq -c '.Views[] | {queue, state, failures, last_error}'</text><text x="18" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;queue&quot;:&quot;webhooks&quot;,&quot;state&quot;:&quot;Dead&quot;,&quot;failures&quot;:3,&quot;last_error&quot;:&quot;panicked: planned panic 3&quot;}</text><text x="18" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;queue&quot;:&quot;email&quot;,&quot;state&quot;:&quot;Dead&quot;,&quot;failures&quot;:3,&quot;last_error&quot;:&quot;planned failure 3&quot;}</text><text x="18" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;queue&quot;:&quot;reports&quot;,&quot;state&quot;:&quot;Dead&quot;,&quot;failures&quot;:3,&quot;last_error&quot;:&quot;planned failure 3&quot;}</text></svg>
