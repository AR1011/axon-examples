[package]
name = "task-queue"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Example: a background-job queue with priorities, delays, retries, a dead set and at-least-once delivery"

[dependencies]
axon.workspace = true
axon-cluster.workspace = true
axon-net.workspace = true
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[lints]
workspace = true
