<svg xmlns="http://www.w3.org/2000/svg" width="880" height="462" viewBox="0 0 880 462" role="img"><title>Three acceptors and two apps</title><rect x="0.5" y="0.5" width="879" height="461" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Three acceptors and two apps</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Each key's Owner actor runs on the app that holds its lease. A majority of the acceptors grants a lease.</text><rect x="235.2" y="72" width="409.5" height="126" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="247.2" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Apps: any id not on ACCEPTORS</text><rect x="186.6" y="262" width="506.9" height="158" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="198.6" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Acceptors: the ids on ACCEPTORS</text><path d="M370 201 L370 259" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M510 259 L510 201" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="247.2" y="96" width="186.8" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="340.6" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">app-a</text><text x="340.6" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">paxos app</text><rect x="259.2" y="142.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="271.2" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">an Owner per key it holds</text><rect x="259.2" y="158.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="271.2" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">asks for k0..k7 each second</text><rect x="446" y="96" width="186.8" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="539.4" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">app-b</text><text x="539.4" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">paxos app</text><rect x="458" y="142.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="470" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">an Owner per key it holds</text><rect x="458" y="158.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="470" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">asks for k0..k7 each second</text><rect x="198.6" y="286" width="153" height="122" rx="6" fill="#e9f5f1" stroke="#8fc2b1"/><text x="275" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">lease-0</text><text x="275" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">paxos acceptor</text><rect x="210.6" y="332.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="222.6" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Paxos acceptor</text><rect x="210.6" y="348.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="222.6" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">seed server</text><rect x="210.6" y="364.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="222.6" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">who holds each key</text><rect x="210.6" y="380.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="222.6" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">on disk in LEASE_DIR</text><rect x="363.5" y="286" width="153" height="122" rx="6" fill="#e9f5f1" stroke="#8fc2b1"/><text x="440" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">lease-1</text><text x="440" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">paxos acceptor</text><rect x="375.5" y="332.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="387.5" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Paxos acceptor</text><rect x="375.5" y="348.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="387.5" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">seed server</text><rect x="375.5" y="364.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="387.5" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">who holds each key</text><rect x="375.5" y="380.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="387.5" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">on disk in LEASE_DIR</text><rect x="528.5" y="286" width="153" height="122" rx="6" fill="#e9f5f1" stroke="#8fc2b1"/><text x="605" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">lease-2</text><text x="605" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">paxos acceptor</text><rect x="540.5" y="332.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="552.5" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Paxos acceptor</text><rect x="540.5" y="348.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="552.5" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">seed server</text><rect x="540.5" y="364.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="552.5" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">who holds each key</text><rect x="540.5" y="380.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="552.5" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">on disk in LEASE_DIR</text><rect x="298.3" y="213" width="143.4" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="370" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">acquire, renew, release:</text><text x="370" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">a majority grants</text><rect x="460.5" y="213" width="98.9" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="510" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">the members</text><text x="510" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">(seed discovery)</text><text x="24" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">An app finds each key's Owner on the app that holds the key's lease. The acceptors host no actors, so an app's crash never takes a vote away.</text></svg>
