<svg xmlns="http://www.w3.org/2000/svg" width="880" height="628" viewBox="0 0 880 628" role="img"><title>The four processes of run.sh</title><rect x="0.5" y="0.5" width="879" height="627" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The four processes of run.sh</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Trades flow down from Binance. A session's first candle request starts the sampler on a processor.</text><path d="M288.7 146 L289.1 223" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M356.6 319 L437.8 377" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M244 319 L189.1 377" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M397 425 L230.4 425" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M230.4 442.3 Q324.4 461 397 446.5" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M138.8 473 L132.7 531" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M716.4 319 L716.5 396" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="220" y="91" width="137" height="52" rx="6" fill="#f6f6f4" stroke="#b3b3ab" stroke-dasharray="4 3"/><text x="288.5" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Binance futures</text><text x="288.5" y="129" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">aggTrade, 5 symbols</text><rect x="650" y="72" width="159.5" height="90" rx="6" fill="#f6f6f4" stroke="#b3b3ab" stroke-dasharray="4 3"/><text x="729.8" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Consul</text><text x="729.8" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">used by every node</text><rect x="662" y="118.5" width="6" height="6" rx="1" fill="#b3b3ab"/><text x="674" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">discovery</text><rect x="662" y="134.5" width="6" height="6" rx="1" fill="#b3b3ab"/><text x="674" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">leases of keyed actors</text><rect x="200" y="226" width="178.8" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="289.4" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">consumer</text><text x="289.4" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">role=consumer</text><rect x="212" y="272.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="224" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Binance actor</text><rect x="212" y="288.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="224" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">origin of trades/&lt;symbol&gt;</text><rect x="650" y="226" width="132.7" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="716.4" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">console</text><text x="716.4" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">port 8080</text><rect x="662" y="272.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="674" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">metrics collector</text><rect x="662" y="288.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="674" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">axon's console</text><rect x="60" y="380" width="167.4" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="143.7" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ws</text><text x="143.7" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">port 9000</text><rect x="72" y="426.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="84" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Session actor per client</text><rect x="72" y="442.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="84" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">relays both streams</text><rect x="400" y="380" width="210.1" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="505.1" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">processor</text><text x="505.1" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">role=processor</text><rect x="412" y="426.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="424" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Sampler per &lt;symbol&gt;:&lt;tf&gt;</text><rect x="412" y="442.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="424" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">origin of candles/&lt;symbol&gt;:&lt;tf&gt;</text><rect x="660" y="399" width="113.2" height="52" rx="6" fill="#f6f6f4" stroke="#b3b3ab" stroke-dasharray="4 3"/><text x="716.6" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ClickHouse</text><text x="716.6" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">metrics history</text><rect x="60" y="534" width="139.5" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="129.7" y="557" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">WebSocket clients</text><text x="129.7" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">load, websocat</text><rect x="253.1" y="175" width="71.6" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="288.9" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">WebSocket</text><rect x="375" y="338.5" width="104.5" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="427.2" y="352.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">trades/&lt;symbol&gt;</text><rect x="134.3" y="338.5" width="104.5" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="186.6" y="352.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">trades/&lt;symbol&gt;</text><rect x="245.9" y="401.5" width="135.7" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="313.7" y="415.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">candles/&lt;symbol&gt;:&lt;tf&gt;</text><rect x="260.3" y="465.7" width="117.5" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="319.1" y="479.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">keyed request:</text><text x="319.1" y="494.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">starts the sampler</text><rect x="93.6" y="492.5" width="84.2" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="135.8" y="506.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">JSON frames</text><rect x="690.5" y="348" width="52" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="716.5" y="362" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">history</text><text x="24" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">The console pulls telemetry from every node. The cluster has no storage of its own: candles live in the samplers' memory.</text></svg>
