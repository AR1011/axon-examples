# Consul (discovery, key ownership) and ClickHouse (metrics history) for the market-data example.
# Same ports as the repository's own compose.yml, so either one serves both; run one of them at a time.
#   docker compose up -d
name: market-data

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: axon
      CLICKHOUSE_PASSWORD: axon-playground
    ports:
      - "127.0.0.1:18123:8123"
    ulimits:
      nofile: 262144

  consul:
    image: hashicorp/consul:1.21
    command: agent -dev -client=0.0.0.0
    ports:
      - "127.0.0.1:18500:8500"
