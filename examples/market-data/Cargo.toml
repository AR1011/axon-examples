[package]
name = "market-data"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Example: Binance trades to on-demand OHLCV candles over a three-role axon cluster"

[dependencies]
axon.workspace = true
axon-cluster = { workspace = true, features = ["consul"] }
axon-net.workspace = true
axon-obs = { workspace = true, features = ["clickhouse", "dashboard", "system-metrics"] }
axon-stream = { workspace = true, features = ["cluster"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
