<svg xmlns="http://www.w3.org/2000/svg" width="880" height="305" viewBox="0 0 880 305" role="img"><title>The engine alone: requests a second</title><rect x="0.5" y="0.5" width="879" height="304" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The engine alone: requests a second</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">A new instance per request, called in process: no HTTP, no actor, no network.</text><rect x="24" y="71" width="10" height="10" rx="2" fill="#3a6fd8"/><text x="39" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">one thread</text><rect x="119.8" y="71" width="10" height="10" rx="2" fill="#23917f"/><text x="134.8" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">24 threads</text><line x1="173.6" y1="98" x2="173.6" y2="275" stroke="#8c959f"/><text x="173.6" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="365.8" y1="98" x2="365.8" y2="275" stroke="#eaeef2"/><text x="365.8" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">20,000</text><line x1="557.9" y1="98" x2="557.9" y2="275" stroke="#eaeef2"/><text x="557.9" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">40,000</text><line x1="750" y1="98" x2="750" y2="275" stroke="#eaeef2"/><text x="750" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">60,000</text><text x="773.7" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">requests/s</text><text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">hello</text><rect x="173.6" y="110" width="63.1" height="16" rx="2" fill="#3a6fd8"/><text x="242.7" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">6,566 requests/s</text><rect x="173.6" y="129" width="549.6" height="16" rx="2" fill="#23917f"/><text x="729.3" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">57,217 requests/s</text><line x1="24" y1="157" x2="856" y2="157" stroke="#eaeef2"/><text x="24" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">json</text><rect x="173.6" y="169" width="47.4" height="16" rx="2" fill="#3a6fd8"/><text x="227" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">4,935 requests/s</text><rect x="173.6" y="188" width="403.7" height="16" rx="2" fill="#23917f"/><text x="583.3" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">42,024 requests/s</text><line x1="24" y1="216" x2="856" y2="216" stroke="#eaeef2"/><text x="24" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">hello, keep_resident 0</text><rect x="173.6" y="228" width="24.8" height="16" rx="2" fill="#3a6fd8"/><text x="204.5" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">2,585 requests/s</text><rect x="173.6" y="247" width="149.3" height="16" rx="2" fill="#23917f"/><text x="328.9" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">15,542 requests/s</text></svg>
