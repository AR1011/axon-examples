<svg xmlns="http://www.w3.org/2000/svg" width="880" height="344" viewBox="0 0 880 344" role="img"><title>The engine: start, deploy and load</title><rect x="0.5" y="0.5" width="879" height="343" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The engine: start, deploy and load</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">The engine alone. A deploy compiles all of SpiderMonkey again; a node loads the result.</text><line x1="234.1" y1="74" x2="234.1" y2="314" stroke="#8c959f"/><text x="234.1" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="363.1" y1="74" x2="363.1" y2="314" stroke="#eaeef2"/><text x="363.1" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">2</text><line x1="492.1" y1="74" x2="492.1" y2="314" stroke="#eaeef2"/><text x="492.1" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">4</text><line x1="621" y1="74" x2="621" y2="314" stroke="#eaeef2"/><text x="621" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">6</text><line x1="750" y1="74" x2="750" y2="314" stroke="#eaeef2"/><text x="750" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">8</text><text x="758.4" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">s</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">engine start, cold compile cache</text><rect x="234.1" y="86" width="61.3" height="16" rx="2" fill="#3a6fd8"/><text x="301.4" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">0.95 s</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">engine start, warm cache</text><rect x="234.1" y="126" width="11" height="16" rx="2" fill="#3a6fd8"/><text x="251.1" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">0.17 s</text><line x1="24" y1="154" x2="856" y2="154" stroke="#eaeef2"/><text x="24" y="178.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">deploy, 24 compile threads</text><rect x="234.1" y="166" width="60.6" height="16" rx="2" fill="#3a6fd8"/><rect x="294.7" y="166" width="5.2" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="305.9" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">0.98 s median (0.94 to 1.02)</text><line x1="24" y1="194" x2="856" y2="194" stroke="#eaeef2"/><text x="24" y="218.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">deploy, one compile thread</text><rect x="234.1" y="206" width="438.5" height="16" rx="2" fill="#3a6fd8"/><text x="678.6" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">6.8 s median</text><line x1="24" y1="234" x2="856" y2="234" stroke="#eaeef2"/><text x="24" y="258.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">load on a node new to it</text><rect x="234.1" y="246" width="50.3" height="16" rx="2" fill="#3a6fd8"/><text x="290.4" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">0.78 s</text><line x1="24" y1="274" x2="856" y2="274" stroke="#eaeef2"/><text x="24" y="298.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">load from the node's cache</text><rect x="234.1" y="286" width="4.1" height="16" rx="2" fill="#3a6fd8"/><text x="244.3" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">64 ms</text></svg>
