<svg xmlns="http://www.w3.org/2000/svg" width="880" height="224" viewBox="0 0 880 224" role="img"><title>Commands answered per second</title><rect x="0.5" y="0.5" width="879" height="223" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Commands answered per second</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">64 clients, each waiting for its answer. The lighter part of a bar is the range over runs.</text><line x1="288.5" y1="74" x2="288.5" y2="194" stroke="#8c959f"/><text x="288.5" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="380.8" y1="74" x2="380.8" y2="194" stroke="#eaeef2"/><text x="380.8" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">5,000</text><line x1="473.1" y1="74" x2="473.1" y2="194" stroke="#eaeef2"/><text x="473.1" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">10,000</text><line x1="565.4" y1="74" x2="565.4" y2="194" stroke="#eaeef2"/><text x="565.4" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">15,000</text><line x1="657.7" y1="74" x2="657.7" y2="194" stroke="#eaeef2"/><text x="657.7" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">20,000</text><line x1="750" y1="74" x2="750" y2="194" stroke="#eaeef2"/><text x="750" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">25,000</text><text x="773.7" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">commands/s</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">demo, whole load, crash included (4 runs)</text><rect x="288.5" y="86" width="92.3" height="16" rx="2" fill="#3a6fd8"/><rect x="380.8" y="86" width="11.1" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="397.9" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">5000 to 5600</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">demo, the 0.3 s before the crash (4 runs)</text><rect x="288.5" y="126" width="304.6" height="16" rx="2" fill="#3a6fd8"/><rect x="593.1" y="126" width="108.9" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="708" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">16500 to 22400</text><line x1="24" y1="154" x2="856" y2="154" stroke="#eaeef2"/><text x="24" y="178.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">3 host processes, no fault (2 runs)</text><rect 