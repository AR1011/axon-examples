<svg xmlns="http://www.w3.org/2000/svg" width="880" height="304" viewBox="0 0 880 304" role="img"><title>How long the accounts of a failed host are away</title><rect x="0.5" y="0.5" width="879" height="303" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">How long the accounts of a failed host are away</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Until a caller is answered again, from the fault, or from the restart for the last row.</text><line x1="288" y1="74" x2="288" y2="274" stroke="#8c959f"/><text x="288" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="403.5" y1="74" x2="403.5" y2="274" stroke="#eaeef2"/><text x="403.5" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">2</text><line x1="519" y1="74" x2="519" y2="274" stroke="#eaeef2"/><text x="519" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">4</text><line x1="634.5" y1="74" x2="634.5" y2="274" stroke="#eaeef2"/><text x="634.5" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">6</text><line x1="750" y1="74" x2="750" y2="274" stroke="#eaeef2"/><text x="750" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">8</text><text x="758.4" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">s</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">crash in process, lease 2 s (4 runs)</text><rect x="288" y="86" width="103.9" height="16" rx="2" fill="#3a6fd8"/><rect x="392" y="86" width="5.8" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="403.7" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1.8 to 1.9 s</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">crash in process, lease 1 s</text><rect x="288" y="126" width="57.8" height="16" rx="2" fill="#3a6fd8"/><text x="351.8" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1.0 s</text><line x1="24" y1="154" x2="856" y2="154" stroke="#eaeef2"/><text x="24" y="178.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">kill -9 a host, lease 2 s: full rate (2 runs)</text><rect x="288" y="166" width="173.2" height="16" rx="2" fill="#3a6fd8"/><text x="467.3" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">within 3 s</text><line x1="24" y1="194" x2="856" y2="194" stroke="#eaeef2"/><text x="24" y="218.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">SIGSTOP a host, lease 1 s (3 runs)</text><rect x="288" y="206" width="404.2" height="16" rx="2" fill="#3a6fd8"/><text x="698.2" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">7 s</text><line x1="24" y1="234" x2="856" y2="234" stroke="#eaeef2"/><text x="24" y="258.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">back on the restarted host</text><rect x="288" y="246" width="63.5" height="16" rx="2" fill="#3a6fd8"/><rect x="351.5" y="246" width="63.5" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="421.1" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1.1 to 2.2 s</text></svg>
