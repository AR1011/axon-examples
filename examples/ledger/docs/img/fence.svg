<svg xmlns="http://www.w3.org/2000/svg" width="880" height="408" viewBox="0 0 880 408" role="img"><title>How a new owner fences the old one</title><rect x="0.5" y="0.5" width="879" height="407" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">How a new owner fences the old one</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">One log segment per owner in DIR/&lt;account&gt;/, named by the lease's epoch. A host writes only to its own.</text><rect x="259.2" y="224" width="361.7" height="142" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="271.2" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">acct-0007/</text><path d="M343.9 127 L356.6 245" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M537.6 127 L530.7 245" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M517.6 127 L429.4 245" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="247.5" y="72" width="186.5" height="52" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="340.7" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">old owner</text><text x="340.7" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">epoch 10, paused, then woken</text><rect x="446" y="72" width="186.5" height="52" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="539.3" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">new owner</text><text x="539.3" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">epoch 20</text><rect x="271.2" y="248" width="162.8" height="106" rx="6" fill="#e9f5f1" stroke="#8fc2b1"/><text x="352.6" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">00..0010.log</text><text x="352.6" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">epoch 10</text><rect x="283.2" y="294.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="295.2" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Own</text><rect x="283.2" y="310.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="295.2" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">events up to byte N</text><rect x="283.2" y="326.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="295.2" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">a late write, past N</text><rect x="446" y="248" width="162.8" height="106" rx="6" fill="#e9f5f1" stroke="#8fc2b1"/><text x="527.4" y="271" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">00..0020.log</text><text x="527.4" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">epoch 20</text><rect x="458" y="294.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="470" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Own { sealed: 10 at N }</text><rect x="458" y="310.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="470" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">events</text><rect x="232.7" y="169" width="155.1" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="310.2" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">write, sync, then look:</text><text x="310.2" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">a newer segment, refused</text><rect x="525.7" y="176.5" width="106.9" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="579.1" y="190.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">1. create it first</text><rect x="400.7" y="169" width="95.7" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="448.5" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">2. read up to N,</text><text x="448.5" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">seal it there</text><text x="24" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Nobody reads past a seal, so the late write is lost and its caller was never told it worked.</text></svg>
