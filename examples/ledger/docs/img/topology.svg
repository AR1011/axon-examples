<svg xmlns="http://www.w3.org/2000/svg" width="880" height="612" viewBox="0 0 880 612" role="img"><title>Three hosts, a load and one shared directory</title><rect x="0.5" y="0.5" width="879" height="611" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Three hosts, a load and one shared directory</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Each account runs on the host that holds its lease. Its log is in the directory every process shares.</text><rect x="143.8" y="242" width="592.4" height="142" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="155.8" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Hosts ledger-a, ledger-b, ledger-c</text><path d="M440 181 L440 239" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M440 387 L440 445" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M668.6 509 L564.6 509" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="347.9" y="72" width="184.2" height="106" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="440" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">load</text><text x="440" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">a cluster node, hosts nothing</text><rect x="359.9" y="118.5" width="6" height="6" rx="1" fill="#aab3bd"/><text x="371.9" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">64 clients</text><rect x="359.9" y="134.5" width="6" height="6" rx="1" fill="#aab3bd"/><text x="371.9" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">a KeyedRef per account</text><rect x="359.9" y="150.5" width="6" height="6" rx="1" fill="#aab3bd"/><text x="371.9" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">retries until answered</text><rect x="155.8" y="266" width="181.5" height="106" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="246.5" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ledger-a</text><text x="246.5" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">host</text><rect x="167.8" y="312.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="179.8" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Account actor per account</text><rect x="167.8" y="328.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="179.8" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Paxos lease acceptor</text><rect x="167.8" y="344.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="179.8" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">seed server</text><rect x="349.3" y="266" width="181.5" height="106" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="440" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ledger-b</text><text x="440" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">host</text><rect x="361.3" y="312.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="373.3" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Account actor per account</text><rect x="361.3" y="328.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="373.3" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Paxos lease acceptor</text><rect x="361.3" y="344.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="373.3" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">seed server</text><rect x="542.7" y="266" width="181.5" height="106" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="633.5" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">ledger-c</text><text x="633.5" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">host</text><rect x="554.7" y="312.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="566.7" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Account actor per account</text><rect x="554.7" y="328.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="566.7" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Paxos lease acceptor</text><rect x="554.7" y="344.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="566.7" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">seed server</text><rect x="318.4" y="448" width="243.2" height="122" rx="6" fill="#e9f5f1" stroke="#8fc2b1"/><text x="440" y="471" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">DIR</text><text x="440" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">one directory, shared</text><rect x="330.4" y="494.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="342.4" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">&lt;account&gt;/&lt;epoch&gt;.log, one per owner</text><rect x="330.4" y="510.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="342.4" y="518" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">&lt;account&gt;/snap</text><rect x="330.4" y="526.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="342.4" y="534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">leases/&lt;host&gt;/, the acceptors' logs</text><rect x="330.4" y="542.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="342.4" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">cut.lock</text><rect x="671.6" y="472" width="131.7" height="74" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="737.4" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">audit</text><text x="737.4" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">ledger audit</text><rect x="683.6" y="518.5" width="6" height="6" rx="1" fill="#aab3bd"/><text x="695.6" y="526" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">checks every rule</text><rect x="365.4" y="193" width="149.2" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="440" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Open, Deposit, Withdraw,</text><text x="440" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Transfer, Balance</text><rect x="368.2" y="399" width="143.7" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="440" y="413" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">append and fsync,</text><text x="440" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">only to its own segment</text><rect x="571.9" y="492" width="89.4" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="616.6" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">read every log</text><text x="616.6" y="521" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">at one instant</text><text x="24" y="594" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Hosts also call each other: a Credit for each transfer, and the lease and seed traffic.</text></svg>
