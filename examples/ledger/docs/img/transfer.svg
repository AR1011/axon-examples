<svg xmlns="http://www.w3.org/2000/svg" width="880" height="506" viewBox="0 0 880 506" role="img"><title>A transfer from acct-0007 to acct-0042</title><rect x="0.5" y="0.5" width="879" height="505" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">A transfer from acct-0007 to acct-0042</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Each step is in a log and synced before the next. The client gets its answer after step 3.</text><path d="M440 127 L440 201" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M473.9 297 Q500 334 473.9 371" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M406.1 371 Q380 334 406.1 297" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="349.9" y="72" width="180.2" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="440" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">client</text><text x="440" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">Transfer { tid, to, amount }</text><rect x="355.2" y="204" width="169.5" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="440" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">acct-0007</text><text x="440" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">source</text><rect x="367.2" y="250.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="379.2" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1. Out: debit the amount</text><rect x="367.2" y="266.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="379.2" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">3. Settled, or Refund</text><rect x="334.8" y="374" width="210.3" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="440" y="397" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">acct-0042</text><text x="440" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">destination</text><rect x="346.8" y="420.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="358.8" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">2. In: credit, once per from/tid</text><rect x="346.8" y="436.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="358.8" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">2. or Reject, if it is not open</text><rect x="363.8" y="147" width="152.4" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="440" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Transfer, and the answer</text><text x="440" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">once settled</text><rect x="513.3" y="324.5" width="167.2" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="596.9" y="338.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Credit { from, tid, amount }</text><rect x="242.4" y="324.5" width="101.2" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="293.1" y="338.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Ok or NoAccount</text><text x="24" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">If the source's host dies between 1 and 3, the next owner of acct-0007 sends the Credit again.</text></svg>
