<svg xmlns="http://www.w3.org/2000/svg" width="880" height="304" viewBox="0 0 880 304" role="img"><title>How the overload phase ended</title><rect x="0.5" y="0.5" width="879" height="303" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">How the overload phase ended</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">The independent run: 4096 requests at once for 10 s. Refused at once, not queued.</text><line x1="205.5" y1="74" x2="205.5" y2="274" stroke="#8c959f"/><text x="205.5" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="314.4" y1="74" x2="314.4" y2="274" stroke="#eaeef2"/><text x="314.4" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">250,000</text><line x1="423.3" y1="74" x2="423.3" y2="274" stroke="#eaeef2"/><text x="423.3" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">500,000</text><line x1="532.2" y1="74" x2="532.2" y2="274" stroke="#eaeef2"/><text x="532.2" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">750,000</text><line x1="641.1" y1="74" x2="641.1" y2="274" stroke="#eaeef2"/><text x="641.1" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">1,000,000</text><line x1="750" y1="74" x2="750" y2="274" stroke="#eaeef2"/><text x="750" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">1,250,000</text><text x="782.2" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">requests</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">200: answered</text><rect x="205.5" y="86" width="488.9" height="16" rx="2" fill="#3a6fd8"/><text x="700.4" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1,122,311 requests</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">429: a gateway at its limit</text><rect x="205.5" y="126" width="232" height="16" rx="2" fill="#3a6fd8"/><text x="443.5" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">532,534 requests</text><line x1="24" y1="154" x2="856" y2="154" stroke="#eaeef2"/><text x="24" y="178.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">503: backends full</text><rect x="205.5" y="166" width="380.9" height="16" rx="2" fill="#3a6fd8"/><text x="592.4" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">874,453 requests</text><line x1="24" y1="194" x2="856" y2="194" stroke="#eaeef2"/><text x="24" y="218.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">504: past the deadline</text><rect x="205.5" y="206" width="1.5" height="16" rx="2" fill="#3a6fd8"/><text x="211.5" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">0 requests</text><line x1="24" y1="234" x2="856" y2="234" stroke="#eaeef2"/><text x="24" y="258.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">hung</text><rect x="205.5" y="246" width="1.5" height="16" rx="2" fill="#3a6fd8"/><text x="211.5" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">0 requests</text></svg>
