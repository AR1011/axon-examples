<svg xmlns="http://www.w3.org/2000/svg" width="880" height="274" viewBox="0 0 880 274" role="img"><title>A read, a write, a deadline and the gateway's counters</title><rect x="0.5" y="0.5" width="879" height="273" rx="6" fill="#22272e" stroke="#d0d7de"/><path d="M0.5 30 H879.5" stroke="#2d333b"/><circle cx="18" cy="15.0" r="5" fill="#2d333b" stroke="#444c56"/><circle cx="34" cy="15.0" r="5" fill="#2d333b" stroke="#444c56"/><circle cx="50" cy="15.0" r="5" fill="#2d333b" stroke="#444c56"/><text x="440" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">A read, a write, a deadline and the gateway's counters</text><text x="18" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ curl -s $G1/v1/quote/42 -w &quot;  %{http_code}\n&quot;</text><text x="18" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;price&quot;:84133,&quot;backend&quot;:&quot;b2&quot;}  200</text><text x="18" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ curl -s -X POST $G1/v1/orders/42 -w &quot;  %{http_code}\n&quot;</text><text x="18" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;order&quot;:1048618,&quot;backend&quot;:&quot;b1&quot;}  201</text><text x="18" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ curl -s -H &quot;x-deadline-ms: 0&quot; $G1/v1/quote/42 -w &quot;  %{http_code}\n&quot;</text><text x="18" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;error&quot;:&quot;deadline&quot;}  504</text><text x="18" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ curl -s $G1/stats | jq -c &quot;.status, {requests, retries, ejections}, .backends[]&quot;</text><text x="18" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;200&quot;:1,&quot;201&quot;:1,&quot;429&quot;:0,&quot;502&quot;:0,&quot;503&quot;:0,&quot;504&quot;:1}</text><text x="18" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;requests&quot;:3,&quot;retries&quot;:0,&quot;ejections&quot;:0}</text><text x="18" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;node&quot;:&quot;b1&quot;,&quot;in_flight&quot;:0,&quot;served&quot;:1,&quot;ejected&quot;:false}</text><text x="18" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;node&quot;:&quot;b2&quot;,&quot;in_flight&quot;:0,&quot;served&quot;:1,&quot;ejected&quot;:false}</text><text x="18" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;node&quot;:&quot;b3&quot;,&quot;in_flight&quot;:0,&quot;served&quot;:0,&quot;ejected&quot;:false}</text></svg>
