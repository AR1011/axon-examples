[package]
name = "api-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Example: an HTTP API gateway in front of backend actors on other nodes, with retry budgets, deadlines and outlier ejection"

[dependencies]
axon.workspace = true
axon-cluster.workspace = true
axon-net.workspace = true
axon-obs = { workspace = true, features = ["dashboard"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }

[dev-dependencies]
axon-testkit.workspace = true

[lints]
workspace = true
