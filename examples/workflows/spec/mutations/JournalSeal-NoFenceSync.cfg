\* The replica answers a seal before its fence is synced: a crash undoes the fence, and an older owner writes on (NoLateWrite).
CONSTANTS
    Replicas = {r1, r2, r3}
    Writers = 3
    MaxLen = 2
    MaxCrashes = 1
    Mutation = "NoFenceSync"
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS AckedKept NoBroken NoLateWrite
