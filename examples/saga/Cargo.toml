[package]
name = "saga"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Order fulfilment as sagas: keyed saga actors drive keyed inventory, payment and shipping actors, and compensate on failure"

[dependencies]
axon.workspace = true
axon-cluster.workspace = true
axon-net.workspace = true
axon-obs = { workspace = true, features = ["dashboard"] }
bytes = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util"] }

[dev-dependencies]
axon-testkit.workspace = true

[lints]
workspace = true
