<svg xmlns="http://www.w3.org/2000/svg" width="880" height="382" viewBox="0 0 880 382" role="img"><title>How 3,000 sagas ended, with n2 killed mid-saga</title><rect x="0.5" y="0.5" width="879" height="381" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">How 3,000 sagas ended, with n2 killed mid-saga</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">saga crash --sagas 3000 --kill-after 1500, release build, at commit 9764f0e.</text><rect x="24" y="71" width="10" height="10" rx="2" fill="#3a6fd8"/><text x="39" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">done</text><rect x="84.4" y="71" width="10" height="10" rx="2" fill="#23917f"/><text x="99.4" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">compensated: out of stock or money</text><rect x="326.8" y="71" width="10" height="10" rx="2" fill="#8659c9"/><text x="341.8" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">compensated: injected failure</text><line x1="82" y1="98" x2="82" y2="332" stroke="#8c959f"/><text x="82" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="249" y1="98" x2="249" y2="332" stroke="#eaeef2"/><text x="249" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11"