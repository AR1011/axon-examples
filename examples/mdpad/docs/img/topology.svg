<svg xmlns="http://www.w3.org/2000/svg" width="880" height="594" viewBox="0 0 880 594" role="img"><title>The roles of an mdpad cluster</title><rect x="0.5" y="0.5" width="879" height="593" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The roles of an mdpad cluster</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">One binary. A node takes one or more roles. A document's actor and its log are on its home.</text><rect x="238.3" y="188" width="228.2" height="158" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="250.3" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Web role: h1, h2, h3, w1</text><rect x="86.7" y="410" width="529.6" height="142" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="98.7" y="427" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Home role: h1, h2, h3</text><rect x="644.3" y="418" width="149" height="126" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="656.3" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Accounts role: h1</text><path d="M438.7 127 L435.2 209" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M254.1 337 L250.4 407" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M424.7 407 L418.3 337" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M457.6 332.7 L641.3 437" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="175.6" y="72" width="168.3" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="259.7" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">browser</text><text x="259.7" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">the page: Yjs, CodeMirror</text><rect x="355.9" y="72" width="168.3" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="440" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">mdpad</text><text x="440" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">command line</text><rect x="536.1" y="72" width="168.3" height="52" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="620.3" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">mdpad load</text><text x="620.3" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">bots, the same protocol</text><rect x="250.3" y="212" width="204.2" height="122" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="352.5" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">a web node</text><text x="352.5" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">no state on disk</text><rect x="262.3" y="258.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="274.3" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">HTTP API and the page</text><rect x="262.3" y="274.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="274.3" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Session actor per socket</text><rect x="262.3" y="290.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="274.3" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Gate: ends revoked sign-ins</text><rect x="262.3" y="306.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="274.3" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">relay of every home's streams</text><rect x="494.6" y="241" width="147.1" height="52" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="568.1" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">seed</text><text x="568.1" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">mdpad seed: discovery</text><rect x="98.7" y="434" width="160.5" height="106"