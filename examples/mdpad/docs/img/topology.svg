">Doc actor per open doc</text><rect x="283.2" y="496.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="295.2" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Journal: one Log</text><rect x="283.2" y="512.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="295.2" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Catalog of its docs</text><rect x="443.8" y="434" width="160.5" height="106" rx="6" fill="#e9f5f1" stroke="#8fc2b1"/><text x="524" y="457" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">h3</text><text x="524" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">home</text><rect x="455.8" y="480.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="467.8" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Doc actor per open doc</text><rect x="455.8" y="496.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="467.8" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Journal: one Log</text><rect x="455.8" y="512.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="467.8" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Catalog of its docs</text><rect x="656.3" y="442" width="125" height="90" rx="6" fill="#e9f5f1" stroke="#8fc2b1"/><text x="718.8" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">accounts</text><text x="718.8" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">users</text><rect x="668.3" y="488.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="680.3" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Accounts actor</text><rect x="668.3" y="504.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="680.3" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">a Log of its own</text><rect x="371.4" y="158.5" width="131.1" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="437" y="172.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">websocket, HTTP /api</text><rect x="186.1" y="355" width="132.3" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="252.2" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">edits and loads,</text><text x="252.2" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">answered once synced</text><rect x="359.6" y="355" width="123.8" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="421.5" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">a compacted stream</text><text x="421.5" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">per document</text><rect x="507.8" y="375.3" width="83.3" height="19" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="549.4" y="389.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">sign-in check</text><text x="24" y="576" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">In scripts/run.sh, h1 is a home, a web node and the accounts; h2 and h3 are a home and a web node; w1 is a web node.</text></svg>
