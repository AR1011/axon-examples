<svg xmlns="http://www.w3.org/2000/svg" width="880" height="652" viewBox="0 0 880 652" role="img"><title>The processes of a scale run</title><rect x="0.5" y="0.5" width="879" height="651" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The processes of a scale run</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">One twin per device, on one twin node. Its state is in that node's memory.</text><rect x="93.3" y="246" width="693.4" height="158" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="105.3" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Twin nodes, label role=twin</text><path d="M346.1 165 L318.8 243" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M533.9 165 L561.2 243" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M367.3 407 L374.3 485" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M505.7 485 L512.7 407" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="292" y="72" width="142" height="90" rx="6" fill="#ffffff" stroke="#aab3bd" stroke-dasharray="4 3"/><text x="363" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">devices</text><tex