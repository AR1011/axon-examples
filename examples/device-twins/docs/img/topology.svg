tart">Twin actor per device</text><rect x="458" y="348.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="470" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">parking lot</text><rect x="458" y="364.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="470" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">stream alerts/twin-3</text><rect x="616.4" y="270" width="158.4" height="122" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="695.5" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">twin-4</text><text x="695.5" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">joins mid-run</text><rect x="628.4" y="316.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="640.4" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">no ingest traffic</text><rect x="628.4" y="332.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="640.4" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Twin actor per device</text><rect x="628.4" y="348.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="640.4" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">parking lot</text><rect x="628.4" y="364.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="640.4" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">stream alerts/twin-4</text><rect x="320" y="488" width="240" height="122" rx="6" fill="#e9f5f1" stroke="#8fc2b1"/><text x="440" y="511" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">alerts</text><text x="440" y="526" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">alerts node, label role=alerts</text><rect x="332" y="534.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="344" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">seed server</text><rect x="332" y="550.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="344" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">lease acceptor, log on disk</text><rect x="332" y="566.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="344" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">Listener: follows every alert stream</text><rect x="332" y="582.5" width="6" height="6" rx="1" fill="#8fc2b1"/><text x="344" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">alert counts</text><rect x="283" y="187" width="98.9" height="34" rx="4" fill="#ffffff" stroke="#eaeef2"/><text x="332.5" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 