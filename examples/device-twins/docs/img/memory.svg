<svg xmlns="http://www.w3.org/2000/svg" width="880" height="304" viewBox="0 0 880 304" role="img"><title>Resident memory per actor</title><rect x="0.5" y="0.5" width="879" height="303" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Resident memory per actor</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">RSS per actor on a node. The lighter part is the range over runs or nodes.</text><line x1="217.6" y1="74" x2="217.6" y2="274" stroke="#8c959f"/><text x="217.6" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="350.7" y1="74" x2="350.7" y2="274" stroke="#eaeef2"/><text x="350.7" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">5</text><line x1="483.8" y1="74" x2="483.8" y2="274" stroke="#eaeef2"/><text x="483.8" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">10</text><line x1="616.9" y1="74" x2="616.9" y2="274" stroke="#eaeef2"/><text x="616.9" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">15</text><line x1="750" y1="74" x2="750" y2="274" stroke="#eaeef2"/><text x="750" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">20</text><text x="761.8" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">KB</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">plain actor (probe)</text><rect x="217.6" y="86" width="42.6" height="16" rx="2" fill="#3a6fd8"/><text x="266.2" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1.6 KB</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">bare keyed actor (probe)</text><rect x="217.6" y="126" width="138.4" height="16" rx="2" fill="#3a6fd8"/><text x="362" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">5.2 KB</text><line x1="24" y1="154" x2="856" y2="154" stroke="#eaeef2"/><text x="24" y="178.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">twin on twin-4, no ingest</text><rect x="217.6" y="166" width="247.6" height="16" rx="2" fill="#3a6fd8"/><rect x="465.2" y="166" width="10.6" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="481.8" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">9.3 to 9.7 KB</text><line x1="24" y1="194" x2="856" y2="194" stroke="#eaeef2"/><text x="24" y="218.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">twin on an ingest node, 200 k</text><rect x="217.6" y="206" width="425.9" height="16" rx="2" fill="#3a6fd8"/><text x="649.5" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">about 16 KB</text><line x1="24" y1="234" x2="856" y2="234" stroke="#eaeef2"/><text x="24" y="258.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">twin on an ingest node, 1 M</text><rect x="217.6" y="246" width="362" height="16" rx="2" fill="#3a6fd8"/><rect x="579.6" y="246" width="21.3" height="16" rx="2" fill="#3a6fd8" fill-opacity="0.4"/><text x="606.9" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">13.6 to 14.4 KB</text></svg>
