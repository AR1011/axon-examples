<svg xmlns="http://www.w3.org/2000/svg" width="880" height="305" viewBox="0 0 880 305" role="img"><title>Reports a second: offered and applied before the join</title><rect x="0.5" y="0.5" width="879" height="304" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Reports a second: offered and applied before the join</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Three scale runs. The lighter part of a bar is the range over the seconds before the join.</text><rect x="24" y="71" width="10" height="10" rx="2" fill="#3a6fd8"/><text x="39" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">offered</text><rect x="103.5" y="71" width="10" height="10" rx="2" fill="#23917f"/><text x="118.5" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">applied</text><line x1="153" y1="98" x2="153" y2="275" stroke="#8c959f"/><text x="153" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="302.2" y1="98" x2="302.2" y2="275" stroke="#eaeef2"/><text x="302.2" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">50</text><line x1="451.5" y1="98" x2="451.5" y2="275" stroke="#eaeef2"/><text x="451.5" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="40