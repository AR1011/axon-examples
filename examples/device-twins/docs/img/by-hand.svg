<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img"><title>An alerts node, a twin node, one device and curl</title><rect x="0.5" y="0.5" width="879" height="291" rx="6" fill="#22272e" stroke="#d0d7de"/><path d="M0.5 30 H879.5" stroke="#2d333b"/><circle cx="18" cy="15.0" r="5" fill="#2d333b" stroke="#444c56"/><circle cx="34" cy="15.0" r="5" fill="#2d333b" stroke="#444c56"/><circle cx="50" cy="15.0" r="5" fill="#2d333b" stroke="#444c56"/><text x="440" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">An alerts node, a twin node, one device and curl</text><text x="18" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ NODE_ID=alerts target/release/device-twins alerts</text><text x="18" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">READY {&quot;node&quot;:&quot;alerts&quot;,&quot;seed&quot;:&quot;127.0.0.1:34279&quot;,&quot;udp&quot;:null,&quot;http&quot;:&quot;127.0.0.1:36835&quot;}</text><text x="18" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ NODE_ID=twin-1 SEEDS=127.0.0.1:34279 target/release/device-twins twin</text><text x="18" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">READY {&quot;node&quot;:&quot;twin-1&quot;,&quot;seed&quot;:null,&quot;udp&quot;:&quot;127.0.0.1:34336&quot;,&quot;http&quot;:&quot;127.0.0.1:46707&quot;}</text><text x="18" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ python3 -c &quot;...&quot;   # device 7 sends readings 1 to 4: 21.5, 91.0, 92.5, 90.0</text><text x="18" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">41000000000000000700000001</text><text x="18" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">41000000000000000700000002</text><text x="18" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">41000000000000000700000003</text><text x="18" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">41000000000000000700000004</text><text x="18" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ curl -s 127.0.0.1:46707/devices/7 | jq -c '{node, last_seq, temperature, min, max, mean, alert, raised}'</text><text x="18" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;node&quot;:&quot;twin-1&quot;,&quot;last_seq&quot;:4,&quot;temperature&quot;:90.0,&quot;min&quot;:21.5,&quot;max&quot;:92.5,&quot;mean&quot;:73.75,&quot;alert&quot;:true,&quot;raised&quot;:1}</text><text x="18" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#9cc2ff" text-anchor="start" xml:space="preserve">$ curl -s 127.0.0.1:36835/stats | jq -c .alerts</text><text x="18" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#d7dce2" text-anchor="start" xml:space="preserve">{&quot;raised&quot;:1,&quot;cleared&quot;:0,&quot;resets&quot;:0,&quot;malformed&quot;:0,&quot;following&quot;:[&quot;twin-1&quot;]}</text></svg>
