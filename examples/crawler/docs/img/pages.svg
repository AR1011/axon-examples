<svg xmlns="http://www.w3.org/2000/svg" width="880" height="364" viewBox="0 0 880 364" role="img"><title>Pages a second against the rate limit</title><rect x="0.5" y="0.5" width="879" height="363" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Pages a second against the rate limit</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Single runs of crawler demo. The limit is the domains times the rate per domain.</text><rect x="24" y="71" width="10" height="10" rx="2" fill="#3a6fd8"/><text x="39" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">pages a second</text><rect x="142.5" y="71" width="10" height="10" rx="2" fill="#23917f"/><text x="157.5" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">limit</text><line x1="150.1" y1="98" x2="150.1" y2="334" stroke="#8c959f"/><text x="150.1" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="300.1" y1="98" x2="300.1" y2="334" stroke="#eaeef2"/><text x="300.1" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">1,000</text><line x1="450.1" y1="98" x2="450.1" y2="334" stroke="#eaeef2"/><text x="450.1" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">2,000</text><line x1="600" y1="98" x2="600" y2="334" stroke="#eaeef2"/><text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">3,000</text><line x1="750" y1="98" x2="750" y2="334" stroke="#eaeef2"/><text x="750" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">4,000</text><text x="770.3" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">pages/s</text><text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">8 × 100, rate 20</text><rect x="150.1" y="110" width="23.4" height="16" rx="2" fill="#3a6fd8"/><text x="179.5" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">156 pages/s</text><rect x="150.1" y="129" width="24" height="16" rx="2" fill="#23917f"/><text x="180.1" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">160 pages/s</text><line x1="24" y1="157" x2="856" y2="157" stroke="#eaeef2"/><text x="24" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">same, kill at 0.4</text><rect x="150.1" y="169" width="23.5" height="16" rx="2" fill="#3a6fd8"/><text x="179.7" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">157 pages/s</text><rect x="150.1" y="188" width="24" height="16" rx="2" fill="#23917f"/><text x="180.1" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">160 pages/s</text><line x1="24" y1="216" x2="856" y2="216" stroke="#eaeef2"/><text x="24" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">64 × 200, rate 50</text><rect x="150.1" y="228" width="460.6" height="16" rx="2" fill="#3a6fd8"/><text x="616.7" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">3071 pages/s</text><rect x="150.1" y="247" width="479.9" height="16" rx="2" fill="#23917f"/><text x="636" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">3200 pages/s</text><line x1="24" y1="275" x2="856" y2="275" stroke="#eaeef2"/><text x="24" y="309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">same, kill at 0.4</text><rect x="150.1" y="287" width="462.2" height="16" rx="2" fill="#3a6fd8"/><text x="618.3" y="299" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">3082 pages/s</text><rect x="150.1" y="306" width="479.9" height="16" rx="2" fill="#23917f"/><text x="636" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">3200 pages/s</text></svg>
