<svg xmlns="http://www.w3.org/2000/svg" width="880" height="304" viewBox="0 0 880 304" role="img"><title>Longest time a domain had no request</title><rect x="0.5" y="0.5" width="879" height="303" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Longest time a domain had no request</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">After a kill, the next hand-over starts the dead node's domains; with no links between domains, resume does.</text><line x1="188.4" y1="74" x2="188.4" y2="274" stroke="#8c959f"/><text x="188.4" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="328.8" y1="74" x2="328.8" y2="274" stroke="#eaeef2"/><text x="328.8" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">50</text><line x1="469.2" y1="74" x2="469.2" y2="274" stroke="#eaeef2"/><text x="469.2" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">100</text><line x1="609.6" y1="74" x2="609.6" y2="274" stroke="#eaeef2"/><text x="609.6" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">150</text><line x1="750" y1="74" x2="750" y2="274" stroke="#eaeef2"/><text x="750" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">200</text><text x="765.2" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">ms</text><text x="24" y="98.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">8 × 100, rate 20</text><rect x="188.4" y="86" width="162.9" height="16" rx="2" fill="#3a6fd8"/><text x="357.2" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">58 ms</text><line x1="24" y1="114" x2="856" y2="114" stroke="#eaeef2"/><text x="24" y="138.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">same, kill at 0.4</text><rect x="188.4" y="126" width="165.7" height="16" rx="2" fill="#3a6fd8"/><text x="360.1" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">59 ms</text><line x1="24" y1="154" x2="856" y2="154" stroke="#eaeef2"/><text x="24" y="178.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">64 × 200, rate 50</text><rect x="188.4" y="166" width="345.4" height="16" rx="2" fill="#3a6fd8"/><text x="539.8" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">123 ms</text><line x1="24" y1="194" x2="856" y2="194" stroke="#eaeef2"/><text x="24" y="218.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">same, kill at 0.4</text><rect x="188.4" y="206" width="325.7" height="16" rx="2" fill="#3a6fd8"/><text x="520.1" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">116 ms</text><line x1="24" y1="234" x2="856" y2="234" stroke="#eaeef2"/><text x="24" y="258.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">kill, no cross links (test)</text><rect x="188.4" y="246" width="561.6" height="16" rx="2" fill="#3a6fd8"/><line x1="736" y1="264" x2="741" y2="244" stroke="#ffffff" stroke-width="2.5"/><line x1="742" y1="264" x2="747" y2="244" stroke="#ffffff" stroke-width="2.5"/><text x="756" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">about 2.1 s</text></svg>
