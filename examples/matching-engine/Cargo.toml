[package]
name = "matching-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Example: an exchange matching engine, one keyed order-book actor per symbol, journaled, with market data on streams"

[dependencies]
axon.workspace = true
axon-cluster.workspace = true
axon-net.workspace = true
axon-stream = { workspace = true, features = ["cluster"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[dev-dependencies]
axon-testkit.workspace = true

[lints]
workspace = true
