<svg xmlns="http://www.w3.org/2000/svg" width="880" height="364" viewBox="0 0 880 364" role="img"><title>Order to ack, accepted orders</title><rect x="0.5" y="0.5" width="879" height="363" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Order to ack, accepted orders</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Closed loop, loopback, journal write included, no fsync. A shared 24-thread dev box.</text><rect x="24" y="71" width="10" height="10" rx="2" fill="#3a6fd8"/><text x="39" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">p50</text><rect x="80.2" y="71" width="10" height="10" rx="2" fill="#23917f"/><text x="95.2" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">p99</text><line x1="179.6" y1="98" x2="179.6" y2="334" stroke="#8c959f"/><text x="179.6" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="322.2" y1="98" x2="322.2" y2="334" stroke="#eaeef2"/><text x="322.2" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">200</text><line x1="464.8" y1="98" x2="464.8" y2="334" stroke="#eaeef2"/><text x="464.8" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">400</text><line x1