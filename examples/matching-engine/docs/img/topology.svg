<svg xmlns="http://www.w3.org/2000/svg" width="880" height="586" viewBox="0 0 880 586" role="img"><title>The cluster of fault.sh</title><rect x="0.5" y="0.5" width="879" height="585" rx="6" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">The cluster of fault.sh</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Seven processes on loopback. Each engine is a lease acceptor. The books are where the fault run starts them.</text><rect x="71.6" y="262" width="736.7" height="126" rx="6" fill="#f7f8fa" stroke="#d6dbe1"/><text x="83.6" y="279" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#59636e" text-anchor="start">Engines e1 to e5, role=engine</text><path d="M284.2 181 L260.3 259" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M312.8 283 L350.7 181" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M563.1 165 L608.3 259" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M402.1 391 L357.3 469" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M569.5 391 L545.2 469" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="261.5" y="72" width="179.9" height="106" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="351.4" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">load</text><text x="351.4" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">role=client</text><rect x="273.5" y="118.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="285.5" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">32 traders on HOT</text><rect x="273.5" y="134.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="285.5" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">1 trader per other symbol</text><rect x="273.5" y="150.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="285.5" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">market-data view of HOT</text><rect x="469.4" y="88" width="149.2" height="74" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="543.9" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">seed</text><text x="543.9" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">seed server</text><rect x="481.4" y="134.5" width="6" height="6" rx="1" fill="#9db4d9"/><text x="493.4" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">who is in the cluster</text><rect x="83.6" y="286" width="132.9" height="90" rx="6" fill="#eef3fb" stroke="#9db4d9"/><text x="150.1"