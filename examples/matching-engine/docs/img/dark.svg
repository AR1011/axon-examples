<svg xmlns="http://www.w3.org/2000/svg" width="880" height="246" viewBox="0 0 880 246" role="img"><title>How long HOT had no answer</title><rect x="0.5" y="0.5" width="879" height="245" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">How long HOT had no answer</text><text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">From the one-second lines of two fault runs, at or just before commit cbbb3f4, before a later fix.</text><rect x="24" y="71" width="10" height="10" rx="2" fill="#3a6fd8"/><text x="39" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">the builder's run (fault2)</text><rect x="200.6" y="71" width="10" height="10" rx="2" fill="#23917f"/><text x="215.6" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">independent run</text><line x1="244" y1="98" x2="244" y2="216" stroke="#8c959f"/><text x="244" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">0</text><line x1="345.2" y1="98" x2="345.2" y2="216" stroke="#eaeef2"/><text x="345.2" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">2</text><line x1="446.4" y1="98" x2="446.4" y2="216" stroke="#eaeef2"/><text x="446.4" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">4</text><line x1="547.6" y1="98" x2="547.6" y2="216" stroke="#eaeef2"/><text x="547.6" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">6</text><line x1="648.8" y1="98" x2="648.8" y2="216" stroke="#eaeef2"/><text x="648.8" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">8</text><line x1="750" y1="98" x2="750" y2="216" stroke="#eaeef2"/><text x="750" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">10</text><text x="761.8" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="start">s</text><text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">after SIGKILL of its owner</text><rect x="244" y="110" width="253" height="16" rx="2" fill="#3a6fd8"/><text x="503" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">about 5 s</text><rect x="244" y="129" width="253" height="16" rx="2" fill="#23917f"/><text x="503" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">about 5 s (t=11-15)</text><line x1="24" y1="157" x2="856" y2="157" stroke="#eaeef2"/><text x="24" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="start">after SIGSTOP of its next owner</text><rect x="244" y="169" width="455.4" height="16" rx="2" fill="#3a6fd8"/><text x="705.4" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">about 9 s</text><rect x="244" y="188" width="506" height="16" rx="2" fill="#23917f"/><text x="756" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start">about 10 s (t=26-35)</text></svg>
